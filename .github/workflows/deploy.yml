# Builds the Astro site and deploys to GitHub Pages.
#
# Triggers:
#   1. Push to main              — normal edit/commit flow.
#   2. Cron every 2 hours       — picks up scheduled posts crossing pubDate.
#   3. Manual (workflow_dispatch) — operator override.
#
# No untrusted inputs are passed to `run:` steps; this workflow only consumes
# its own action outputs and the repo checkout, so there's no injection surface.

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Twelve builds a day, every two hours. This replaced three crons at
    # 03:30/05:30/07:00 UTC on 2026-08-28.
    #
    # Why: a post only reaches the site once a build runs on or after its
    # pubDate, but Buffer fires the social post on its own schedule regardless.
    # The old three-cron spread assumed GitHub's scheduler runs up to ~4 hours
    # late. Measured delivery on this repo:
    #
    #   2026-08-20..26   fired 04:00-04:10, 05:54-06:04, 07:30-07:57  (~30 min)
    #   2026-08-27       fired 14:21, 16:39, 18:06                    (~11 hours)
    #   2026-08-28       nothing by 11:52 UTC
    #
    # Two days running, the day's post sat at 404 through the whole morning
    # while its LinkedIn and Facebook posts pointed at it. Both were fixed by
    # hand. Three crons of drift absorption does not survive an 11 hour delay,
    # because three times late is still late.
    #
    # Spreading the crons across the full day means that whatever the constant
    # delay happens to be, from zero to about twelve hours, some run lands in
    # the window between 00:00 UTC (pubDate rollover) and the morning Buffer
    # fire. Under normal drift the 00:17 run publishes within the hour, which
    # is better than the old 04:00.
    #
    # Running early is harmless: src/lib/posts.ts isPublished() gates on
    # `pubDate <= today` in UTC, so a build before midnight simply omits
    # tomorrow's post rather than publishing it early. Only lateness hurts.
    #
    # Cost is nil: this repo is public, so Actions minutes are unmetered. The
    # `concurrency: pages, cancel-in-progress: false` group below serialises
    # runs, and a rebuild is idempotent (same source, fresh dist).
    #
    # Minute 17 rather than :00 on purpose. GitHub documents that scheduled
    # workflows are delayed most at the top of the hour, when everyone else's
    # crons land.
    - cron: '17 0 * * *'
    - cron: '17 2 * * *'
    - cron: '17 4 * * *'
    - cron: '17 6 * * *'
    - cron: '17 8 * * *'
    - cron: '17 10 * * *'
    - cron: '17 12 * * *'
    - cron: '17 14 * * *'
    - cron: '17 16 * * *'
    - cron: '17 18 * * *'
    - cron: '17 20 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Type & content check
        run: npm run check

      - name: Build
        env:
          NODE_ENV: production
          # Astro inlines vars prefixed with PUBLIC_ at build time. The GA4
          # measurement ID is non-secret (visible in client HTML) but lives
          # in repo secrets so forks do not inherit it.
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    # PRs run build + audit + check for verification, but never deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
